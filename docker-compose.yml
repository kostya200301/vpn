# VPN-сервер: Xray-core (VLESS + REALITY) + MTProto-прокси для Telegram (mtg).
#
# Конфигурации сервисов НЕ редактируются вручную — они генерируются в ./data
# скриптами (install.sh / manage.sh) из шаблонов в ./config и значений из .env.
#
# Версии образов закреплены здесь. Переопределить можно в .env (XRAY_IMAGE / MTG_IMAGE).

name: vpn-server

x-hardening: &hardening
  restart: unless-stopped          # автозапуск после перезагрузки VPS
  read_only: true                  # файловая система контейнера только для чтения
  cap_drop: [ALL]                  # никаких Linux capabilities
  security_opt:
    - "no-new-privileges:true"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  xray:
    <<: *hardening
    image: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:26.10.31}
    container_name: vpn-xray
    user: "65532:65532"            # непривилегированный пользователь (distroless nonroot)
    command: ["run", "-c", "/etc/xray/config.json"]
    ports:
      - "${XRAY_PORT:-443}:10443/tcp"
    volumes:
      - ./data/xray:/etc/xray:ro
    stop_grace_period: 10s

  mtproto:
    <<: *hardening
    image: ${MTG_IMAGE:-nineseconds/mtg:2.2.8}
    container_name: vpn-mtproto
    profiles: ["telegram"]         # включается через COMPOSE_PROFILES=telegram в .env
    user: "65534:65534"            # nobody:nogroup
    command: ["run", "/config/config.toml"]
    ports:
      - "${MTG_PORT:-8443}:3128/tcp"
    volumes:
      - ./data/mtproto:/config:ro
    stop_grace_period: 10s
